<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Hover 形状效果</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1d1b1a;
        }
        .stage{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 56px;
            padding: 56px 32px;
        }
        .cube{
            position: relative;
            width: 170px;
            height: 170px;
            transition: transform .3s ease, box-shadow .3s ease;
        }
        /* hover 时中间浮现 "hover" 字样 */
        .cube::after{
            content: '';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, .92);
            font-size: 22px;
            font-family: Arial, Helvetica, sans-serif;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity .3s ease;
            pointer-events: none;
        }
        .cube:hover::after{
            content: 'hover';
            opacity: 1;
        }
        /* hover 统一样式：上移 10px */
        .cube:hover{
            transform: translateY(-10px);
        }

        /* 1. 橙色直角方块 */
        .c1{
            background: linear-gradient(135deg, #ff9a56, #ff5e62);
            box-shadow: 0 10px 24px rgba(255, 94, 98, .35);
        }
        .c1:hover{ box-shadow: 0 0 24px rgba(255, 94, 98, .35); }

        /* 2. 绿色小圆角方块 */
        .c2{
            border-radius: 18px;
            background: linear-gradient(135deg, #3ddc97, #1fb981);
            box-shadow: 0 10px 24px rgba(52, 211, 153, .35);
        }
        .c2:hover{ box-shadow: 0 0 24px rgba(52, 211, 153, .35); }

        /* 3. 紫色大圆角方块 */
        .c3{
            border-radius: 32px;
            background: linear-gradient(135deg, #b39ddb, #8e7cc3);
            box-shadow: 0 10px 24px rgba(179, 157, 219, .35);
        }
        .c3:hover{ box-shadow: 0 0 24px rgba(179, 157, 219, .35); }

        /* 4. 黄色圆形 */
        .c4{
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd97d, #ffb347);
            box-shadow: 0 10px 24px rgba(255, 209, 102, .35);
        }
        .c4:hover{ box-shadow: 0 0 24px rgba(255, 209, 102, .35); }

        /* 5. 墨绿直角方块 */
        .c5{
            border-radius: 6px;
            background: linear-gradient(135deg, #5b8a72, #3f6b5e);
            box-shadow: 0 10px 24px rgba(91, 138, 114, .35);
        }
        .c5:hover{ box-shadow: 0 0 24px rgba(91, 138, 114, .35); }

        /* 6. 淡紫圆形 */
        .c6{
            border-radius: 50%;
            background: linear-gradient(135deg, #d4c1e8, #b39ddb);
            box-shadow: 0 10px 24px rgba(195, 174, 214, .35);
        }
        .c6:hover{ box-shadow: 0 0 24px rgba(195, 174, 214, .35); }
    </style>
</head>
<body>
    <div class="stage">
        <div class="cube c1"></div>
        <div class="cube c2"></div>
        <div class="cube c3"></div>
        <div class="cube c4"></div>
        <div class="cube c5"></div>
        <div class="cube c6"></div>
    </div>
</body>
</html>
